<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
        .login-card { max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="card card-panel login-card m-3">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-2" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#e63946;color:#fff;border-radius:12px;font-size:1.5rem;">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h4 class="mb-1">{{ app_name }}</h4>
                <p class="text-muted small mb-0">{{ app_full_name }}</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>
        <div class="card-footer text-center small text-muted">
            Decision-support tool only · Violations require manual review
        </div>
    </div>
</body>
</html>
